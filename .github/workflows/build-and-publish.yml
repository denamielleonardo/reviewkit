name: Build and publish ReviewKit

# Every push to main builds the Windows app and publishes it to
# https://denamielleonardo.github.io/reviewkit/ (the only download location).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows app
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Check review skills
        shell: pwsh
        env:
          SKILLS_B64: ${{ secrets.REVIEWKIT_SKILLS_B64 }}
        run: |
          # Skills are committed in skills/. An optional REVIEWKIT_SKILLS_B64 secret overrides them.
          if ($env:SKILLS_B64) {
            [IO.File]::WriteAllBytes("skills.zip", [Convert]::FromBase64String($env:SKILLS_B64))
            Expand-Archive skills.zip -DestinationPath skills -Force
            Remove-Item skills.zip
            Write-Output "Using skills from the REVIEWKIT_SKILLS_B64 secret."
          } else {
            Write-Output "Using skills committed in skills/."
          }
          $required = @(
            "skills/capataz-api-reviewer/SKILL.md",
            "skills/angular-code-reviewer/SKILL.md",
            "skills/ionic-framework-code-reviewer/SKILL.md",
            "skills/technical-design-reviewer/SKILL.md"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { Write-Output "::error::Skill file missing: $f"; exit 1 }
          }

      - name: Stamp build version
        shell: pwsh
        run: |
          $version = "1.0.${{ github.run_number }}"
          $sha = "${{ github.sha }}".Substring(0, 7)
          "VERSION = `"$version`"`nCOMMIT = `"$sha`"`n" | Set-Content -Encoding utf8 app/_build.py
          "REVIEWKIT_VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "REVIEWKIT_COMMIT=$sha" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build with PyInstaller
        run: pyinstaller build.spec --noconfirm

      - name: Smoke test the build
        shell: pwsh
        run: |
          $env:REVIEWKIT_PORT = "8799"
          $p = Start-Process -FilePath "dist/ReviewKit/ReviewKit.exe" -ArgumentList "--server-only" -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod "http://127.0.0.1:8799/api/status" -TimeoutSec 2; $ok = $true; break } catch {}
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Output "::error::Built app did not start"; exit 1 }
          Write-Output "App started, version $($r.version), reviews: $($r.reviews.Count)"

      - name: Smoke test as a downloaded app (internet-marked files, desktop window)
        shell: pwsh
        run: |
          # Reproduce what users get: every extracted file carries the Internet zone mark.
          # (Python writes the NTFS stream; PowerShell's -Stream isn't available on the runner.)
          python -c "import os; n=0`nfor d,_,fs in os.walk('dist/ReviewKit'):`n  for f in fs: open(os.path.join(d,f)+':Zone.Identifier','w').write('[ZoneTransfer]\nZoneId=3\n'); n+=1`nprint('marked', n, 'files')"
          python -c "import os,sys; sys.exit(0 if os.path.exists('dist/ReviewKit/_internal/pythonnet/runtime/Python.Runtime.dll:Zone.Identifier') else 1)"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::Could not mark files as downloaded"; exit 1 }
          $log = Join-Path $env:APPDATA "ReviewKit\reviewkit.log"
          Remove-Item $log -ErrorAction SilentlyContinue
          $env:REVIEWKIT_PORT = "8798"
          $p = Start-Process -FilePath "dist/ReviewKit/ReviewKit.exe" -PassThru
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 1
            try { Invoke-RestMethod "http://127.0.0.1:8798/api/status" -TimeoutSec 2 | Out-Null; $ok = $true; break } catch {}
          }
          Start-Sleep -Seconds 8   # give the window time to initialise pythonnet
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Output "::error::Downloaded-style app did not start"; exit 1 }
          python -c "import os,sys; sys.exit(1 if os.path.exists('dist/ReviewKit/_internal/pythonnet/runtime/Python.Runtime.dll:Zone.Identifier') else 0)"
          if ($LASTEXITCODE -ne 0) { Write-Output "::error::App did not remove the internet mark from Python.Runtime.dll"; exit 1 }
          if ((Test-Path $log) -and (Select-String -Path $log -Pattern "Python.Runtime" -Quiet)) {
            Get-Content $log | Write-Output
            Write-Output "::error::Desktop window failed to load Python.Runtime.dll"; exit 1
          }
          Write-Output "Downloaded-style launch OK: marks removed and the desktop window loaded."

      - name: Package and build download page
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force _site | Out-Null
          7z a -tzip -mx=7 _site/ReviewKit.zip ./dist/ReviewKit | Out-Null
          $zip = Get-Item _site/ReviewKit.zip
          $sizeMb = [Math]::Round($zip.Length / 1MB)
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          $date = (Get-Date).ToUniversalTime().ToString("d MMM yyyy")
          $html = Get-Content site/index.html -Raw
          $html = $html.Replace("{{VERSION}}", $env:REVIEWKIT_VERSION).Replace("{{COMMIT}}", $env:REVIEWKIT_COMMIT)
          $html = $html.Replace("{{SIZE_MB}}", "$sizeMb").Replace("{{SHA256}}", $hash).Replace("{{DATE}}", $date)
          Set-Content -Path _site/index.html -Value $html -Encoding utf8
          Copy-Item app/static/logo.svg _site/logo.svg
          # Read by installed copies of ReviewKit to find and verify updates (app/updater.py).
          $manifest = [ordered]@{
            version = $env:REVIEWKIT_VERSION
            commit  = $env:REVIEWKIT_COMMIT
            date    = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            file    = "ReviewKit.zip"
            size    = $zip.Length
            sha256  = $hash
          }
          [IO.File]::WriteAllText("$PWD/_site/version.json", ($manifest | ConvertTo-Json))
          New-Item -ItemType File _site/.nojekyll | Out-Null
          Write-Output "ReviewKit.zip: $sizeMb MB, sha256 $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          include-hidden-files: true
          retention-days: 3

  publish:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1200000   # 20 min; GitHub's Pages backend can be slow during incidents
